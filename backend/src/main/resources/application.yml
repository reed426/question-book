spring:
  datasource:
    url: jdbc:h2:mem:questionbook;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-request-size: 20MB
      max-file-size: 20MB
file:
  upload-dir: uploads
jwt:
  secret: change-this-to-a-long-random-string-later
  expiration: 86400000


logging:
  level:
    org.springframework.security: DEBUG